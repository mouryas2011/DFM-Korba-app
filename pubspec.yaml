name: dfm_korba_app
description: "Production mobile application wrapper for DFM Korba (Drone Film Making Korba) Google Apps Script Web App."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.1+2

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # Production-grade WebView for Google Apps Script session, file upload, cookies & popups
  flutter_inappwebview: ^6.1.5

  # Real-time connectivity monitoring
  connectivity_plus: ^6.1.0

  # Native external intent launcher (WhatsApp, Phone, Email, Maps, Browser)
  url_launcher: ^6.3.1

  # Local file storage for downloads and certificates
  path_provider: ^2.1.5

  # Native file opener for PDFs and downloaded media
  open_filex: ^4.6.0

  # File sharing integration
  share_plus: ^10.1.2

  # Contextual runtime permissions for Camera, Gallery, and Storage
  permission_handler: ^11.3.1

  # Polished animated loading widgets
  flutter_spinkit: 5.2.0

  # Cupertino icons for iOS look and feel
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
