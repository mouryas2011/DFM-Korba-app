name: Build Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyzer & tests
        run: |
          flutter analyze || true
          flutter test || true

      - name: Build Android Release APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flutter build apk --release -v 2>&1 | tee /tmp/flutter_build.log || true
          APK_FOUND=$(find build -type f -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            echo "### ❌ Build Failure Diagnostics" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            python3 -c "
with open('/tmp/flutter_build.log', 'r', errors='ignore') as f:
    lines = f.readlines()
indices = [i for i, l in enumerate(lines) if 'What went wrong' in l or 'FAILURE:' in l or 'error:' in l.lower()]
if indices:
    start = max(0, indices[0] - 10)
    end = min(len(lines), indices[0] + 80)
    print(''.join(lines[start:end]))
else:
    print(''.join(lines[-120:]))
" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            gh issue create --title "Build Failure Log - $(date +'%H:%M:%S')" --body "$(python3 -c "
with open('/tmp/flutter_build.log', 'r', errors='ignore') as f:
    lines = f.readlines()
indices = [i for i, l in enumerate(lines) if 'What went wrong' in l or 'FAILURE:' in l or 'error:' in l.lower()]
if indices:
    start = max(0, indices[0] - 10)
    end = min(len(lines), indices[0] + 120)
    print(''.join(lines[start:end]))
else:
    print(''.join(lines[-120:]))
")" || true
            exit 1
          fi

      - name: Upload Build Failure Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-failure-log
          path: /tmp/flutter_build.log

      - name: Prepare Release APK Artifacts
        run: |
          mkdir -p build/dist
          find build -type f -name "*.apk" -ls
          APK_FILE=$(find build -type f -name "*release*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find build -type f -name "*.apk" | head -n 1)
          fi
          echo "Discovered APK: $APK_FILE"
          cp "$APK_FILE" build/dist/dfm-korba.apk
          cp "$APK_FILE" build/dist/app-release.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dfm-korba-release-apk
          path: build/dist/dfm-korba.apk
          retention-days: 30

      - name: Publish Direct Mobile Download Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: release-v1.0
          name: "DFM Korba Android App v1.0.0"
          body: |
            ## 📱 DFM Korba Mobile App (Android APK)
            
            Official production mobile application for **DFM Korba (Drone Film Making Korba)**:
            - **Live Platform**: https://www.dfmkorba.online/
            - **Package Identifier**: `com.dfmkorba.app`
            
            ### 📥 Direct Mobile Installation:
            Download `dfm-korba.apk` directly on your Android phone and tap to install.
          files: |
            build/dist/dfm-korba.apk
            build/dist/app-release.apk
