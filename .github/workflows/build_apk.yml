name: Build Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyzer & tests
        run: |
          flutter analyze || true
          flutter test || true

      - name: Build Android Release APK
        run: |
          set -o pipefail
          flutter build apk --release -v 2>&1 | tee /tmp/flutter_build.log || {
            echo "### ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 /tmp/flutter_build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Copy Release APK with Brand Name
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/dfm-korba.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dfm-korba-release-apk
          path: build/app/outputs/flutter-apk/dfm-korba.apk
          retention-days: 30

      - name: Publish Direct Mobile Download Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: release-v1.0
          name: "DFM Korba Android App v1.0.0"
          body: |
            ## 📱 DFM Korba Mobile App (Android APK)
            
            Official production mobile application for **DFM Korba (Drone Film Making Korba)**:
            - **Live Platform**: https://www.dfmkorba.online/
            - **Package**: `com.dfmkorba.app`
            
            ### 📥 Direct Mobile Installation:
            Download `dfm-korba.apk` directly on your Android phone and tap to install.
          files: |
            build/app/outputs/flutter-apk/dfm-korba.apk
            build/app/outputs/flutter-apk/app-release.apk
